name: Provision connected evaluator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kids-connected-evaluator
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/finalproject-AP'
    runs-on: ubuntu-latest
    environment: connected-evaluator
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_EMBEDDING_MODEL: openai/text-embedding-3-small
      OPENROUTER_SITE_URL: https://kids.alfredopretelvargas.com
      PUBLIC_SITE_URL: https://kids.alfredopretelvargas.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements.lock.txt
      - run: npm ci
      - run: python -m pip install -r services/ai/requirements.lock.txt
      - name: Check required protected values
        shell: bash
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID SUPABASE_URL SUPABASE_SECRET_KEY OWNER_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub environment secret: $name"
              exit 1
            fi
          done
      - name: Link database
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Preview migrations
        run: npx supabase db push --dry-run
      - name: Apply migrations
        run: npx supabase db push
      - name: Bootstrap the owner identity
        run: python scripts/bootstrap_remote.py
      - name: Compile the connected synthetic evaluation catalog
        run: python scripts/ingest_catalog.py --release-channel synthetic-demo
