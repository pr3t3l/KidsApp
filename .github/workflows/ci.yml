name: Final project validation

on:
  pull_request:
  push:
    branches: [main, finalproject-AP]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai/requirements-dev.txt
            services/ai/requirements.lock.txt
      - run: npm ci
      - run: python -m pip install -r services/ai/requirements-dev.txt
      - run: npm run validate
      - run: npm run audit:deps

  containers:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
